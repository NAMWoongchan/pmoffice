name: Verify ebook generator
on:
  pull_request:
    branches: [main]
    paths: ['ebook-app/**', 'supabase/migrations/202610310001_ebooks.sql', '.github/workflows/ebooks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir ebook-app install --frozen-lockfile
      - run: pnpm --dir ebook-app run build
      - run: pnpm --dir ebook-app test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r ebook-app/converter/requirements.txt
      - run: python -m unittest discover -s ebook-app/converter -p 'test_*.py'
